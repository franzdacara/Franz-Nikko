<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Nikko Dacara — Full-stack developer specializing in Laravel, React, and healthcare information systems. Based in Davao City, Philippines." />
  <title>Nikko Dacara — Software Developer</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="/js/tailwindcss.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          colors: {
            surface: {
              DEFAULT: '#0e0e0e',
              raised: '#161616',
              overlay: '#1c1c1c',
            },
            border: {
              DEFAULT: '#262626',
              subtle: '#1e1e1e',
              hover: '#3f3f46',
            },
            accent: {
              DEFAULT: '#f59e0b',
              hover: '#fbbf24',
              muted: 'rgba(245, 158, 11, 0.12)',
            },
            text: {
              primary: '#e4e4e7',
              secondary: '#a1a1aa',
              muted: '#71717a',
            }
          },
          fontSize: {
            'display': ['clamp(3rem, 8vw, 6rem)', { lineHeight: '0.95', letterSpacing: '-0.03em', fontWeight: '800' }],
            'heading': ['clamp(1.75rem, 4vw, 2.5rem)', { lineHeight: '1.1', letterSpacing: '-0.02em', fontWeight: '700' }],
          },
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #0e0e0e;
      color: #e4e4e7;
      overflow-x: hidden;
      font-feature-settings: 'ss01', 'cv01';
    }

    /* Scrollbar — minimal, functional */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0e0e0e;
    }

    ::-webkit-scrollbar-thumb {
      background: #262626;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    /* Selection */
    ::selection {
      background: rgba(245, 158, 11, 0.3);
      color: #e4e4e7;
    }

    /* Utility: border-accent highlight for active elements */
    .border-accent-active {
      border-color: #f59e0b;
    }

    /* Subtle noise texture for surfaces */
    .surface-noise {
      position: relative;
    }
    .surface-noise::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* Grid rule — subtle horizontal rules */
    .grid-rule {
      background-image: linear-gradient(to bottom, transparent calc(100% - 1px), #262626 calc(100% - 1px));
      background-size: 100% 80px;
    }

    /* Scanline effect for Preloader */
    .scanline {
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.15) 50%, rgba(0, 0, 0, 0.15));
      background-size: 100% 4px;
      animation: scanline 10s linear infinite;
    }

    @keyframes scanline {
      0% { background-position: 0 0; }
      100% { background-position: 0 100%; }
    }

    /* Hard shift hover — used on interactive cards */
    .hover-shift {
      transition: transform 150ms cubic-bezier(0.33, 1, 0.68, 1), border-color 150ms ease;
    }
    .hover-shift:hover {
      transform: translateY(-2px) translateX(2px);
    }

    /* Tag style */
    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6875rem;
      line-height: 1;
      letter-spacing: 0.02em;
      padding: 0.25rem 0.5rem;
      border: 1px solid #262626;
      color: #a1a1aa;
      transition: color 150ms ease, border-color 150ms ease;
    }

    .tag:hover {
      color: #f59e0b;
      border-color: #f59e0b;
    }

    /* Section label — small monospace category labels */
    .section-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6875rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f59e0b;
    }

    /* Scroll Reveal Engine — 60fps GPU-accelerated */
    .reveal-init {
      opacity: 0;
      transform: translate3d(0, 24px, 0);
      transition: opacity 700ms cubic-bezier(0.16, 1, 0.3, 1), transform 700ms cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }

    .reveal-visible {
      opacity: 1 !important;
      transform: translate3d(0, 0, 0) !important;
    }

    /* Stagger Delays */
    .delay-75 { transition-delay: 75ms; }
    .delay-150 { transition-delay: 150ms; }
    .delay-225 { transition-delay: 225ms; }
    .delay-300 { transition-delay: 300ms; }
    .delay-375 { transition-delay: 375ms; }
    .delay-450 { transition-delay: 450ms; }
    .delay-600 { transition-delay: 600ms; }

    /* Tactile Buttons — Anti-AI crisp physical response */
    .btn-tactile-primary {
      background-color: #f59e0b;
      color: #0e0e0e;
      border: 1px solid #f59e0b;
      transition: transform 120ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 120ms cubic-bezier(0.16, 1, 0.3, 1), background-color 120ms ease;
    }
    .btn-tactile-primary:hover {
      background-color: #fbbf24;
      transform: translate3d(-2px, -2px, 0);
      box-shadow: 2px 2px 0 0 #0e0e0e, 3px 3px 0 0 #f59e0b;
    }
    .btn-tactile-primary:active {
      transform: translate3d(0, 0, 0);
      box-shadow: none;
    }

    .btn-tactile-secondary {
      border: 1px solid #262626;
      background-color: #161616;
      color: #a1a1aa;
      transition: transform 120ms cubic-bezier(0.16, 1, 0.3, 1), border-color 120ms ease, color 120ms ease, box-shadow 120ms ease;
    }
    .btn-tactile-secondary:hover {
      border-color: #71717a;
      color: #e4e4e7;
      transform: translate3d(-1px, -1px, 0);
      box-shadow: 2px 2px 0 0 rgba(0, 0, 0, 0.5);
    }
    .btn-tactile-secondary:active {
      transform: translate3d(0, 0, 0);
      box-shadow: none;
    }

    /* Architectural corner crosshair marks */
    .corner-crosshair {
      position: relative;
    }
    .corner-crosshair::before {
      content: '+';
      position: absolute;
      top: -6px;
      left: -5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      line-height: 1;
      color: #3f3f46;
      pointer-events: none;
    }
    .corner-crosshair::after {
      content: '+';
      position: absolute;
      bottom: -6px;
      right: -5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      line-height: 1;
      color: #3f3f46;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
